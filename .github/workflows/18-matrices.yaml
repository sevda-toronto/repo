name: 18 - Matrix - Final Practice with Include and Exclude
on: workflow_dispatch
run-name: Matrices will keep rocking forever!!!
jobs:
  first:
    runs-on: ubuntu-latest 
    strategy:
      matrix:
        color: ['red', 'blue']
        shape: ['square', 'circle']
        include:
          - opacity: 50
    steps:
      - name: Print color-shapre combination 
        run: echo ${{matrix.color}}- ${{matrix.shape}}-${{matrix.opacity}}
