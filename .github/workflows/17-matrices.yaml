name: Matrix Retry Example
on: workflow_dispatch
jobs:
  example-job:
    name: ${{matrix.node}} - Node.js Test 
    runs-on: ubuntu-latest 
    continue-on-error: true 
    strategy:
      fail-fast: false 
      matrix:
        node: ['14.x', '16.x', '999.x']
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node}}
      - name: Run tests
        run: echo "Testing Node Js version ${{matrix.node}}"