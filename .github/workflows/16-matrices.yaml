name: 16 - Working with Matrices
run-name: Matrices rock again!!!
on: workflow_dispatch
jobs:
  include-example:
    name: ${{matrix.color}}-${{matrix.shape}}-${{matrix.size}}-${{matrix.opacity}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        color: ['red', 'green']
        shape: ['circle', 'square']
        size: ['small', 'large']
        include:
          - color: red
            opacity: 75
          - opacity: 50 
    steps:
      - name: Dummy step
        run: echo ${{matrix.color}} - ${{matrix.shape}} - ${{matrix.size}}
