name: 16 - Working with Matrices
run-name: Matrices rock again!!!
on: workflow_dispatch
jobs:
  include-example:
    name: ${{matrix.color}}-${{matrix.shape}}-${{matrix.size}}-${{matrix.tag||''}}-${{matrix.opacity}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        color: ['red', 'green']
        shape: ['circle', 'square']
        size: ['small', 'large']
        include:
          - opacity: 50 
          - color: red
            shape: triangle
            tag: cookie 
            size: small
          - color: red
            shape: triangle
            size: large 
            tag: cookie 

        
    steps:
      - name: Dummy step
        run: echo ${{matrix.color}} - ${{matrix.shape}} - ${{matrix.size}}
