name:  15 - Working with Matrices
run-name: Matrices rock!
on: workflow_dispatch
jobs:
  backwards-compatability:
    name: ${{matrix.os}} - ${{matrix.node}} - ${{matrix.tag || ''}}
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false 
      matrix:
        node: ['18.x', '20.x', '21.x']
        os:
          - ubuntu-latest
          - windows-latest
        include: 
           - os: ubuntu-latest
             node: '16.x'
           - os: ubuntu-latest
             node: '21.x'
             tag: experimental
    steps:
      - name: Set-up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node}}
      - name: Fail if experimental
        if: ${{matrix.tag=='experimental'}}
        run: exit 1
      - name: Perform some tests
        run: echo "Running test on  OS ${{matrix.os}} and Node version ${{matrix.node}}"
     
